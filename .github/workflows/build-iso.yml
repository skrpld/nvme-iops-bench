name: Build offline IOPS-bench ISO

on:
  workflow_dispatch:
    inputs:
      fio_version:
        description: "fio tag to build"
        required: false
        default: "fio-3.36"

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FIO_VERSION: ${{ inputs.fio_version || 'fio-3.36' }}
      MUSL_INC: /usr/include/x86_64-linux-musl
      MUSL_LIB: /usr/lib/x86_64-linux-musl

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            musl-tools genisoimage libaio-dev linux-libc-dev

      # musl-gcc replaces the default include and library search paths instead of
      # extending them, so kernel headers and libaio are invisible without these links.
      - name: Expose kernel and libaio headers/libs to musl-gcc
        run: |
          set -x
          sudo ln -sfn /usr/include/linux                 "$MUSL_INC/linux"
          sudo ln -sfn /usr/include/asm-generic           "$MUSL_INC/asm-generic"
          sudo ln -sfn /usr/include/x86_64-linux-gnu/asm  "$MUSL_INC/asm"
          sudo ln -sfn /usr/include/libaio.h              "$MUSL_INC/libaio.h"
          sudo ln -sfn /usr/lib/x86_64-linux-gnu/libaio.a "$MUSL_LIB/libaio.a"
          test -e "$MUSL_INC/linux/unistd.h"
          test -e "$MUSL_INC/asm/unistd.h"
          test -e "$MUSL_INC/libaio.h"
          test -e "$MUSL_LIB/libaio.a"

      # Same probe fio's configure runs, but failing here gives a readable error
      # instead of a silent "Linux AIO support no" further down.
      - name: Preflight - musl + libaio static link
        run: |
          cat > /tmp/aiotest.c <<'EOF'
          #include <libaio.h>
          int main(void) { io_context_t ctx; return io_queue_init(1, &ctx); }
          EOF
          musl-gcc -print-file-name=libaio.a
          musl-gcc -static -o /tmp/aiotest /tmp/aiotest.c -laio
          if /tmp/aiotest; then
            echo "libaio: link + runtime OK"
          else
            echo "::warning::libaio linked, but io_queue_init returned $?"
          fi

      - name: Build static fio
        run: |
          git clone --depth 1 --branch "$FIO_VERSION" https://github.com/axboe/fio.git /tmp/fio
          cd /tmp/fio
          # --disable-native: -march=native would target the runner CPU and may SIGILL
          # on an older offline VM.
          CC=musl-gcc ./configure --build-static --disable-native 2>&1 | tee /tmp/fio-configure.log

          grep -qE '^Static build +yes' /tmp/fio-configure.log \
            || { echo "::error::fio is not built statically"; exit 1; }
          if ! grep -qE '^Linux AIO support +yes' /tmp/fio-configure.log; then
            echo "::error::libaio not detected - ioengine=libaio would be missing on the VM"
            tail -n 60 config.log || true
            exit 1
          fi

          make -j"$(nproc)"

      - name: Verify binary
        run: |
          strip /tmp/fio/fio
          /tmp/fio/fio --version
          file /tmp/fio/fio
          ldd /tmp/fio/fio || true
          /tmp/fio/fio --enghelp | tee /tmp/enghelp.txt
          grep -qw libaio /tmp/enghelp.txt \
            || { echo "::error::ioengine libaio missing from the built fio"; exit 1; }

      # Staged separately so that .git/ and the ISO itself stay out of the image.
      - name: Stage ISO contents
        run: |
          STAGE="$RUNNER_TEMP/iso"
          mkdir -p "$STAGE/bin"
          cp 02_run_benchmark.sh 03_generate_report.py README.md "$STAGE/"
          cp /tmp/fio/fio "$STAGE/bin/fio"
          chmod 755 "$STAGE/bin/fio" "$STAGE/02_run_benchmark.sh" "$STAGE/03_generate_report.py"
          find "$STAGE" -type f -printf '%M %p\n'

      - name: Build ISO
        run: |
          # -R (full Rock Ridge) preserves permissions, including the executable bit.
          genisoimage -V "NVMEBENCH" -J -R \
            -o "$RUNNER_TEMP/nvme-iops-bench.iso" "$RUNNER_TEMP/iso"
          ls -lh "$RUNNER_TEMP/nvme-iops-bench.iso"

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvme-iops-bench-iso
          path: ${{ runner.temp }}/nvme-iops-bench.iso
          if-no-files-found: error
